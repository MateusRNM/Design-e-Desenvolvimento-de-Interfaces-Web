<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
    <title>Dash 01</title>
</head>
<body>
    <div class="container">
        <header>
            <div class="headerBox">
                <div class="icon">
                    <img class="images" src="../images/icon-dash01.png" alt="icon" width="48px" height="48px">
                </div>
                <span>Material Able</span>
                <span class="material-icons">menu</span>
                <span class="material-icons">zoom_out_map</span>
            </div>
            <div class="headerBox">
                <span class="material-icons">notifications_none</span>
                <div class="avatar">
                    <img class="images" src="https://cdn-icons-png.flaticon.com/512/4792/4792929.png" alt="avatar" width="45px" height="45px">
                </div>
                <span class="name">John Doe</span>
                <span class="material-icons">keyboard_arrow_down</span>
            </div>
        </header>

        <div class="subheader">
            <div class="box1">perfil</div>
            <div class="box2">welcome</div>
        </div>

        <main>
            <aside>
                <div class="searchBox">
                    <span class="material-icons">search</span>
                    <input type="text" name="search" id="search" placeholder="Search Friend">
                </div>

                <div class="menu">

                    <div class="menu-section">
                        <h3>Navigation</h3>
                        <ul>
                            <li class="menu-item active">
                                <span class="material-icons">home</span>
                                <span class="text">Dashboard</span>
                            </li>
                        </ul>
                    </div>

                    <div class="menu-section">
                        <h3>UI Element</h3>
                        <ul>
                            <li class="menu-item">
                                <span class="material-icons">window</span>
                                <span class="text">Basic</span>
                            </li>
                        </ul>
                    </div>

                    <div class="menu-section">
                        <h3>Forms</h3>
                        <ul>
                            <li class="menu-item">
                                <span class="material-icons">layers</span>
                                <span class="text">Form</span>
                            </li>
                        </ul>
                    </div>

                    <div class="menu-section">
                        <h3>Tables</h3>
                        <ul>
                            <li class="menu-item">
                                <span class="material-icons">assignment</span>
                                <span class="text">Table</span>
                            </li>
                        </ul>
                    </div>

                    <div class="menu-section">
                        <h3>Chart and Maps</h3>
                        <ul>
                            <li class="menu-item">
                                <span class="material-icons">bar_chart</span>
                                <span class="text">Charts</span>
                            </li>
                        </ul>
                    </div>

                </div>
            </aside>
            
            <div class="content">

            </div>
        </main>
    </div>
</body>
</html>
